spring:
  application:
    name: CaseDev

  datasource:
    url: jdbc:postgresql://localhost:5432/srm_credit
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true